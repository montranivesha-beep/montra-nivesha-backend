}

/* =========================================================
   MODAL HANDLERS
   ========================================================= */
function attachModalHandlers(){
  document.querySelectorAll('[data-close]').forEach(el=> el.onclick = closeModal);

  // table modal
  const saveTable = document.querySelector('[data-save-table]');
  if(saveTable) saveTable.onclick = async ()=>{
    const t = tableById(saveTable.dataset.saveTable);
    const newName = document.getElementById('nameInp').value.trim();
    const oldId = t.id;
    const newIdIfChanged = (newName && newName!==t.id) ? newName : undefined;
    if(newIdIfChanged && state.tables.some(x=>x.id===newIdIfChanged)){
      alert(`Table ${newIdIfChanged} already exists.`); return;
    }
    const section = document.getElementById('secSel').value;
    const capacity = Number(document.getElementById('capSel').value);
    const status = document.getElementById('statSel').value;
    try{
      await apiFetch(`/tables/${encodeURIComponent(oldId)}`, {method:'PUT', body:JSON.stringify({
        section_id:section, capacity, status, new_id:newIdIfChanged
      })});
    }catch(err){ alert(err.message); return; }
    if(newIdIfChanged){
      t.id = newIdIfChanged;
      state.orders.forEach(o=>{ if(o.target.type==='table' && o.target.id===oldId) o.target.id = newIdIfChanged; });
      state.reservations.forEach(r=>{ if(r.tableId===oldId) r.tableId = newIdIfChanged; });
    }
    t.section = section; t.capacity = capacity; t.status = status;
    showToast(`Table ${t.id} updated`);
    closeModal();
  };
  const deleteTable = document.querySelector('[data-delete-table]');
  if(deleteTable) deleteTable.onclick = async ()=>{
    const id = deleteTable.dataset.deleteTable;
    const t = tableById(id);
    if(t.status==='occupied' && !confirm(`Table ${id} has an open order. Delete it anyway?`)) return;
    try{ await apiFetch(`/tables/${encodeURIComponent(id)}`, {method:'DELETE'}); }
    catch(err){ alert(err.message); return; }
    state.tables = state.tables.filter(x=>x.id!==id);
    showToast(`Table ${id} removed`);
    closeModal();
  };
  const newOrderBtn = document.querySelector('[data-new-order]');
  if(newOrderBtn) newOrderBtn.onclick = ()=> startOrderBuilder(newOrderBtn.dataset.newOrder, null);
  const addItemsBtn = document.querySelector('[data-add-items]');
  if(addItemsBtn) addItemsBtn.onclick = ()=>{
    const t = tableById(addItemsBtn.dataset.addItems);
    const o = orderById(t.orderId);
    startOrderBuilder(t.id, o.items, o.note);
  };
  const billFromTable = document.querySelector('[data-bill-from-table]');
  if(billFromTable) billFromTable.onclick = ()=> openModal({type:'bill', orderId:Number(billFromTable.dataset.billFromTable), method:'cash'});

  // order builder
  if(state.modal && state.modal.type==='orderBuilder') attachOrderBuilderHandlers();

  // reservation
  const saveRes = document.querySelector('[data-save-reservation]');
  if(saveRes) saveRes.onclick = async ()=>{
    const tableId = document.getElementById('rTable').value;
    const date = document.getElementById('rDate').value;
    const time = document.getElementById('rTime').value;
    const dur = document.getElementById('rDur').value;
    const name = document.getElementById('rName').value||'Guest';
    const party = Number(document.getElementById('rParty').value);
    const phone = document.getElementById('rPhone').value;
    const occasion = document.getElementById('rOcc').value;
    const note = document.getElementById('rNote').value;
    let created;
    try{
      created = await apiFetch('/reservations', {method:'POST', body:JSON.stringify({
        name, party, table_id:tableId, date, time, duration:Number(dur), phone, occasion, note
      })});
    }catch(err){
      document.getElementById('resWarn').innerHTML = `<div class="warn-box">${err.message}</div>`;
      return;
    }
    const r = mapReservation(created);
    state.reservations.push(r);
    const t = tableById(tableId);
    if(date===todayStr()) t.status='reserved';
    showToast(`Reservation confirmed for ${r.name}`);
    closeModal();
  };

  // menu item
  function wireImageRemoveLink(){
    const removeLink = document.getElementById('mImageRemoveLink');
    if(removeLink) removeLink.onclick = (e)=>{
      e.preventDefault();
      menuItemImageDraft = 'REMOVE';
      document.getElementById('mImagePreviewWrap').innerHTML = '<div class="empty" style="padding:8px 0;">No photo selected</div>';
    };
  }
  wireImageRemoveLink();
  const mImageFile = document.getElementById('mImageFile');
  if(mImageFile) mImageFile.onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      menuItemImageDraft = reader.result;
      document.getElementById('mImagePreviewWrap').innerHTML =
        `<img id="mImagePreview" src="${reader.result}" style="width:100px; height:100px; object-fit:cover; border-radius:4px; border:1px solid var(--line); display:block; margin-bottom:6px;"><a href="#" id="mImageRemoveLink" style="font-size:11.5px; color:var(--st-occupied);">Remove photo</a>`;
      wireImageRemoveLink();
    };
    reader.readAsDataURL(file);
  };
  const saveMenu = document.querySelector('[data-save-menuitem]');
  if(saveMenu) saveMenu.onclick = async ()=>{
    const idAttr = saveMenu.dataset.saveMenuitem;
    const data = {
      name:document.getElementById('mName').value,
      cat:document.getElementById('mCat').value,
      price:Number(document.getElementById('mPrice').value),
      cost:Number(document.getElementById('mCost').value),
      section:document.getElementById('mSection').value || null,
      mods:document.getElementById('mMods').value
    };
    const apiBody = {
      name:data.name, category:data.cat, price:data.price, cost:data.cost,
      section_id:data.section, modifiers:data.mods
    };
    if(menuItemImageDraft==='REMOVE') apiBody.clear_image = true;
    else if(menuItemImageDraft) apiBody.image = menuItemImageDraft;
    saveMenu.disabled = true;
    try{
      if(idAttr){
        const updated = await apiFetch(`/menu/${idAttr}`, {method:'PUT', body:JSON.stringify(apiBody)});
        Object.assign(menuItem(Number(idAttr)), mapMenuItem(updated));
        if(!updated.section_id) delete menuItem(Number(idAttr)).section;
        showToast('Menu item updated');
      } else {
        const created = await apiFetch('/menu', {method:'POST', body:JSON.stringify(apiBody)});
        state.menu.push(mapMenuItem(created));
        showToast('Menu item added');
      }
    }catch(err){ alert(err.message); saveMenu.disabled = false; return; }
    closeModal();
  };

  // bill
  const splitSel = document.getElementById('splitN');
  if(splitSel) splitSel.onchange = ()=>{
    const o = orderById(state.modal.orderId);
    const {total} = orderTotal(o);
    const n = Number(splitSel.value);
    document.getElementById('splitResult').textContent = n>1 ? `${n} payments of ${money(total/n)} each` : '';
  };
  const billMethodSel = document.getElementById('billMethod');
  if(billMethodSel) billMethodSel.onchange = ()=>{ state.modal.method = billMethodSel.value; render(); };
  const settleBill = document.querySelector('[data-settle-bill]');
  if(settleBill) settleBill.onclick = async ()=>{
    const o = orderById(Number(settleBill.dataset.settleBill));
    const {total} = orderTotal(o);
    const method = state.modal.method || 'cash';
    const roomId = method==='room' ? document.getElementById('billRoom').value : undefined;
    const acctId = method==='ledger' ? Number(document.getElementById('billLedger').value) : undefined;
    try{
      await apiFetch(`/orders/${o.id}/settle`, {method:'POST', body:JSON.stringify({
        method, room_id:roomId, ledger_account_id:acctId
      })});
    }catch(err){ alert(err.message); return; }
    if(method==='room'){
      if(!state.roomFolios[roomId]) state.roomFolios[roomId] = {charges:[], balance:0};
      state.roomFolios[roomId].charges.push({orderId:o.id, amount:total, date:new Date().toLocaleString()});
      state.roomFolios[roomId].balance += total;
      o.settlement = {type:'room', roomId};
      showToast(`Order #${o.id} posted to Room ${roomId} — ${money(total)}`);
    } else if(method==='ledger'){
      const acct = state.cityLedgerAccounts.find(a=>a.id===acctId);
      acct.balance += total;
      acct.transactions.push({orderId:o.id, amount:total, date:new Date().toLocaleString()});
      o.settlement = {type:'ledger', accountId:acctId};
      showToast(`Order #${o.id} posted to ${acct.name} — ${money(total)}`);
    } else {
      o.settlement = {type:'cash'};
      showToast(`Order #${o.id} settled`);
    }
    o.status='paid';
    if(o.target.type==='table'){
      const t = tableById(o.target.id);
      t.status='cleaning'; t.orderId=null;
    }
    closeModal();
  };
  const printInvoiceBtn = document.getElementById('printInvoiceBtn');
  if(printInvoiceBtn) printInvoiceBtn.onclick = printCurrentModal;
  document.querySelectorAll('[data-print-modal]').forEach(el=>{ el.onclick = printCurrentModal; });

  // my profile (self-service)
  const saveProfile = document.querySelector('[data-save-profile]');
  if(saveProfile) saveProfile.onclick = async ()=>{
    const name = document.getElementById('pName').value.trim();
    const username = document.getElementById('pUser').value.trim();
    const pass = document.getElementById('pPass').value;
    if(!name || !username){ alert('Name and username are required.'); return; }
    const body = {name, username};
    if(pass) body.password = pass;
    try{
      const updated = await apiFetch('/auth/me', {method:'PUT', body:JSON.stringify(body)});
      state.currentUser = {...state.currentUser, ...mapStaff(updated)};
      const inList = state.staff.find(s=>s.id===state.currentUser.id);
      if(inList) Object.assign(inList, mapStaff(updated));
    }catch(err){ alert(err.message); return; }
    showToast('Profile updated');
    closeModal();
  };

  // city ledger accounts
  const saveLedger = document.querySelector('[data-save-ledger]');
  if(saveLedger) saveLedger.onclick = async ()=>{
    const idAttr = saveLedger.dataset.saveLedger;
    const name = document.getElementById('laName').value.trim();
    const contact = document.getElementById('laContact').value.trim();
    const creditLimit = Number(document.getElementById('laLimit').value)||0;
    if(!name){ alert('Account name is required.'); return; }
    try{
      if(idAttr){
        const updated = await apiFetch(`/city-ledger/accounts/${idAttr}`, {method:'PUT', body:JSON.stringify({name, contact, credit_limit:creditLimit})});
        Object.assign(state.cityLedgerAccounts.find(a=>a.id===Number(idAttr)), mapLedgerAccount(updated));
        showToast('Account updated');
      } else {
        const created = await apiFetch('/city-ledger/accounts', {method:'POST', body:JSON.stringify({name, contact, credit_limit:creditLimit})});
        state.cityLedgerAccounts.push(mapLedgerAccount(created));
        showToast('City ledger account created');
      }
    }catch(err){ alert(err.message); return; }
    closeModal();
  };
  const settleRoomBtn = document.querySelector('[data-settle-room]');
  if(settleRoomBtn) settleRoomBtn.onclick = async ()=>{
    const roomId = settleRoomBtn.dataset.settleRoom;
    const f = state.roomFolios[roomId];
    if(!confirm(`Settle ${money(f.balance)} for Room ${roomId} at checkout?`)) return;
    try{ await apiFetch(`/city-ledger/room-folios/${encodeURIComponent(roomId)}/settle`, {method:'POST'}); }
    catch(err){ alert(err.message); return; }
    f.balance = 0;
    f.charges = [];
    showToast(`Room ${roomId} folio settled`);
    closeModal();
  };
  const settleLedgerBtn = document.querySelector('[data-settle-ledger]');
  if(settleLedgerBtn) settleLedgerBtn.onclick = async ()=>{
    const a = state.cityLedgerAccounts.find(x=>x.id===Number(settleLedgerBtn.dataset.settleLedger));
    if(!confirm(`Settle ${money(a.balance)} for ${a.name}?`)) return;
    try{ await apiFetch(`/city-ledger/accounts/${a.id}/settle`, {method:'POST'}); }
    catch(err){ alert(err.message); return; }
    a.balance = 0;
    a.transactions.push({type:'settlement', amount:0, date:new Date().toLocaleString(), note:'Account settled'});
    showToast(`${a.name} account settled`);
    closeModal();
  };

  // catering: venues, packages, events
  const saveVenue = document.querySelector('[data-save-venue]');
  if(saveVenue) saveVenue.onclick = async ()=>{
    const idAttr = saveVenue.dataset.saveVenue;
    const name = document.getElementById('vName').value.trim();
    const capacity = Number(document.getElementById('vCapacity').value)||1;
    const rentalFee = Number(document.getElementById('vFee').value)||0;
    if(!name){ alert('Venue name is required.'); return; }
    try{
      if(idAttr){
        const updated = await apiFetch(`/catering/venues/${idAttr}`, {method:'PUT', body:JSON.stringify({name, capacity, rental_fee:rentalFee})});
        Object.assign(state.venues.find(v=>v.id===Number(idAttr)), mapVenue(updated));
        showToast('Venue updated');
      } else {
        const created = await apiFetch('/catering/venues', {method:'POST', body:JSON.stringify({name, capacity, rental_fee:rentalFee})});
        state.venues.push(mapVenue(created));
        showToast('Venue added');
      }
    }catch(err){ alert(err.message); return; }
    closeModal();
  };
  const savePackage = document.querySelector('[data-save-package]');
  if(savePackage) savePackage.onclick = async ()=>{
    const idAttr = savePackage.dataset.savePackage;
    const name = document.getElementById('pkgName').value.trim();
    const pricePerGuest = Number(document.getElementById('pkgPrice').value)||0;
    const cost = Number(document.getElementById('pkgCost').value)||0;
    const description = document.getElementById('pkgDesc').value.trim();
    if(!name){ alert('Package name is required.'); return; }
    const body = {name, price_per_guest:pricePerGuest, cost_per_guest:cost, description};
    try{
      if(idAttr){
        const updated = await apiFetch(`/catering/packages/${idAttr}`, {method:'PUT', body:JSON.stringify(body)});
        Object.assign(state.cateringPackages.find(p=>p.id===Number(idAttr)), mapPackage(updated));
        showToast('Package updated');
      } else {
        const created = await apiFetch('/catering/packages', {method:'POST', body:JSON.stringify(body)});
        state.cateringPackages.push(mapPackage(created));
        showToast('Package added');
      }
    }catch(err){ alert(err.message); return; }
    closeModal();
  };
  const saveService = document.querySelector('[data-save-service]');
  if(saveService) saveService.onclick = async ()=>{
    const idAttr = saveService.dataset.saveService;
    const name = document.getElementById('svcName').value.trim();
    const rate = Number(document.getElementById('svcRate').value)||0;
    const cost = Number(document.getElementById('svcCost').value)||0;
    const description = document.getElementById('svcDesc').value.trim();
    if(!name){ alert('Service name is required.'); return; }
    const body = {name, rate, cost, description};
    try{
      if(idAttr){
        const updated = await apiFetch(`/catering/services/${idAttr}`, {method:'PUT', body:JSON.stringify(body)});
        Object.assign(state.additionalServices.find(s=>s.id===Number(idAttr)), mapService(updated));
        showToast('Service updated');
      } else {
        const created = await apiFetch('/catering/services', {method:'POST', body:JSON.stringify(body)});
        state.additionalServices.push(mapService(created));
        showToast('Service added');
      }
    }catch(err){ alert(err.message); return; }
    closeModal();
  };
  const saveSource = document.querySelector('[data-save-source]');
  if(saveSource) saveSource.onclick = async ()=>{
    const idAttr = saveSource.dataset.saveSource;
    const name = document.getElementById('srcName').value.trim();
    if(!name){ alert('Source name is required.'); return; }
    try{
      if(idAttr){
        Object.assign(state.businessSources.find(s=>s.id===Number(idAttr)), {name});
        showToast('Business source updated');
      } else {
        const created = await apiFetch('/catering/business-sources', {method:'POST', body:JSON.stringify({name})});
        state.businessSources.push(mapBusinessSource(created));
        showToast('Business source added');
      }
    }catch(err){ alert(err.message); return; }
    closeModal();
  };
  const evVenueSel = document.getElementById('evVenue');
  if(evVenueSel) evVenueSel.onchange = ()=>{
    const rate = evVenueSel.selectedOptions[0].dataset.rate;
    document.getElementById('evVenueRate').value = rate;
  };
  const svcAddBtn = document.getElementById('svcAddBtn');
  if(svcAddBtn) svcAddBtn.onclick = ()=>{
    const serviceId = Number(document.getElementById('svcPicker').value);
    const qty = Number(document.getElementById('svcPickerQty').value)||1;
    const existing = eventServiceDraft.find(es=>es.serviceId===serviceId);
    if(existing) existing.qty += qty; else eventServiceDraft.push({serviceId, qty});
    renderServiceDraftList();
  };
  attachServiceDraftHandlers();
  const evPackageSel = document.getElementById('evPackage');
  if(evPackageSel) evPackageSel.onchange = ()=>{
    const rate = evPackageSel.selectedOptions[0].dataset.rate;
    document.getElementById('evPkgRate').value = rate;
  };
  const saveEvent = document.querySelector('[data-save-event]');
  if(saveEvent) saveEvent.onclick = async ()=>{
    const idAttr = saveEvent.dataset.saveEvent;
    const venueId = Number(document.getElementById('evVenue').value);
    const date = document.getElementById('evDate').value;
    const startTime = document.getElementById('evStart').value;
    const endTime = document.getElementById('evEnd').value;
    const body = {
      name: document.getElementById('evName').value.trim() || 'Untitled Event',
      client: document.getElementById('evClient').value.trim(),
      phone: document.getElementById('evPhone').value.trim(),
      business_source: document.getElementById('evSource').value,
      travel_agency: document.getElementById('evAgency').value.trim(),
      voucher_number: document.getElementById('evVoucher').value.trim(),
      venue_id: venueId, date, start_time:startTime, end_time:endTime,
      venue_rate: Number(document.getElementById('evVenueRate').value)||0,
      guest_count: Number(document.getElementById('evGuests').value)||1,
      package_id: Number(document.getElementById('evPackage').value),
      package_rate: Number(document.getElementById('evPkgRate').value)||0,
      extra_services: eventServiceDraft.filter(es=>es.qty>0).map(es=>({service_id:es.serviceId, qty:es.qty})),
      deposit: Number(document.getElementById('evDeposit').value)||0,
      note: document.getElementById('evNote').value.trim()
    };
    try{
      let saved;
      if(idAttr){
        saved = await apiFetch(`/catering/events/${idAttr}`, {method:'PUT', body:JSON.stringify(body)});
        Object.assign(state.events.find(e=>e.id===Number(idAttr)), mapEvent(saved));
        showToast('Event updated');
      } else {
        saved = await apiFetch('/catering/events', {method:'POST', body:JSON.stringify(body)});
        state.events.push(mapEvent(saved));
        showToast('Event booked');
      }
    }catch(err){
      document.getElementById('eventWarn').innerHTML = `<div class="warn-box">${err.message}</div>`;
      return;
    }
    eventServiceDraft = [];
    closeModal();
  };

  // event invoice
  const evBillMethodSel = document.getElementById('evBillMethod');
  if(evBillMethodSel) evBillMethodSel.onchange = ()=>{
    state.modal.method = evBillMethodSel.value;
    render();
  };
  const settleEventBtn = document.querySelector('[data-settle-event]');
  if(settleEventBtn) settleEventBtn.onclick = async ()=>{
    const ev = state.events.find(e=>e.id===Number(settleEventBtn.dataset.settleEvent));
    const {total} = eventTotal(ev);
    const balanceDue = Math.max(0, total-(ev.deposit||0));
    const method = state.modal.method || 'cash';
    const roomId = method==='room' ? document.getElementById('evBillRoom').value : undefined;
    const acctId = method==='ledger' ? Number(document.getElementById('evBillLedger').value) : undefined;
    try{
      await apiFetch(`/catering/events/${ev.id}/settle`, {method:'POST', body:JSON.stringify({
        method, room_id:roomId, ledger_account_id:acctId
      })});
    }catch(err){ alert(err.message); return; }
    if(method==='room'){
      if(!state.roomFolios[roomId]) state.roomFolios[roomId] = {charges:[], balance:0};
      state.roomFolios[roomId].charges.push({orderId:'EV'+ev.id, amount:balanceDue, date:new Date().toLocaleString()});
      state.roomFolios[roomId].balance += balanceDue;
      ev.settlement = {type:'room', roomId};
      showToast(`${ev.name} invoice posted to Room ${roomId} — ${money(balanceDue)}`);
    } else if(method==='ledger'){
      const acct = state.cityLedgerAccounts.find(a=>a.id===acctId);
      acct.balance += balanceDue;
      acct.transactions.push({orderId:'EV'+ev.id, amount:balanceDue, date:new Date().toLocaleString()});
      ev.settlement = {type:'ledger', accountId:acctId};
      showToast(`${ev.name} invoice posted to ${acct.name} — ${money(balanceDue)}`);
    } else {
      ev.settlement = {type:'cash'};
      showToast(`${ev.name} invoice settled`);
    }
    ev.invoiceStatus = 'Paid';
    closeModal();
  };

  // staff / user management
  const saveStaff = document.querySelector('[data-save-staff]');
  if(saveStaff) saveStaff.onclick = async ()=>{
    const idAttr = saveStaff.dataset.saveStaff;
    const name = document.getElementById('sName').value;
    const username = document.getElementById('sUser').value;
    const password = document.getElementById('sPass').value;
    const role = document.getElementById('sRole').value;
    const shift = document.getElementById('sShift').value;
    if(!name || !username || (!idAttr && !password)){ alert('Name, username, and password are required.'); return; }
    try{
      if(idAttr){
        const body = {name, username, role, shift};
        if(password) body.password = password;
        const updated = await apiFetch(`/staff/${idAttr}`, {method:'PUT', body:JSON.stringify(body)});
        const s = state.staff.find(x=>x.id===Number(idAttr));
        Object.assign(s, mapStaff(updated));
        if(state.currentUser.id===s.id){ state.currentUser = {...state.currentUser, ...mapStaff(updated)}; state.role = s.role; }
        showToast('Staff account updated');
      } else {
        const created = await apiFetch('/staff', {method:'POST', body:JSON.stringify({name, username, password, role, shift})});
        state.staff.push(mapStaff(created));
        showToast('Staff account created');
      }
    }catch(err){ alert(err.message); return; }
    closeModal();
  };

  // customer preview cart
  document.querySelectorAll('[data-cart-inc]').forEach(el=>{
    el.onclick = ()=>{
      const id=el.dataset.cartInc;
      state.cart[id]=(state.cart[id]||0)+1;
      if(!state.cartOrder.includes(id)) state.cartOrder.push(id);
      render();
    };
  });
  document.querySelectorAll('[data-cart-dec]').forEach(el=>{
    el.onclick = ()=>{
      const id=el.dataset.cartDec;
      state.cart[id]=Math.max(0,(state.cart[id]||0)-1);
      if(state.cart[id]===0) state.cartOrder = state.cartOrder.filter(x=>x!==id);
      render();
    };
  });
  document.querySelectorAll('[data-seq-up]').forEach(el=>{
    el.onclick = ()=>{
      const i = Number(el.dataset.seqUp);
      if(i>0){ [state.cartOrder[i-1],state.cartOrder[i]] = [state.cartOrder[i],state.cartOrder[i-1]]; }
      render();
    };
  });
  document.querySelectorAll('[data-seq-down]').forEach(el=>{
    el.onclick = ()=>{
      const i = Number(el.dataset.seqDown);
      if(i<state.cartOrder.length-1){ [state.cartOrder[i],state.cartOrder[i+1]] = [state.cartOrder[i+1],state.cartOrder[i]]; }
      render();
    };
  });
  const submitPickBtn = document.getElementById('submitPickBtn');
  if(submitPickBtn) submitPickBtn.onclick = ()=>{ state.orderStep='arrange'; render(); };
  const backToBrowse = document.getElementById('backToBrowse');
  if(backToBrowse) backToBrowse.onclick = (e)=>{ e.preventDefault(); state.orderStep='browse'; render(); };
  const cartNoteInp = document.getElementById('cartNote');
  if(cartNoteInp) cartNoteInp.oninput = (e)=>{ state.cartNote = e.target.value; };
  const sendOrder = document.querySelector('[data-send-order]');
  if(sendOrder) sendOrder.onclick = async ()=>{
    const [kind,id] = sendOrder.dataset.sendOrder.split(':');
    const items = state.cartOrder.filter(iid=>state.cart[iid]>0).map(iid=>({itemId:Number(iid), qty:state.cart[iid], course:'Main'}));
    if(items.length===0) return;
    const apiItems = items.map(it=>({menu_item_id:it.itemId, qty:it.qty, course:it.course}));
    let created;
    try{
      created = await apiFetch('/orders', {method:'POST', body:JSON.stringify({
        target_type:kind, target_id:id, items:apiItems, note:state.cartNote
      })});
    }catch(err){ alert(err.message); return; }
    const order = mapOrder(created);
    state.orders.push(order);
    if(kind==='table'){
      const t = tableById(id);
      t.status='occupied'; t.orderId = order.id;
    }
    state.cart = {};
    state.cartOrder = [];
    state.cartNote = '';
    state.orderStep = 'browse';
    showToast(`Order #${order.id} sent to the kitchen from ${kind==='table'?'Table '+id:'Room '+id}`);
    closeModal();
    state.view='orders'; render();
  };
}

/* ---- order builder modal (separate because it needs its own render) ---- */
function orderBuilderHtml(){
  const tableSection = tableById(orderBuilder.tableId)?.section;
  const available = menuForContext(tableSection);
  const cats = getCategoryOrderFor(tableSection);
  const total = orderBuilder.items.reduce((s,it)=> s + menuItem(it.itemId).price*it.qty, 0);
  return `
  <div class="modal wide">
    <div class="modal-head"><h3>Build Order &middot; Table ${orderBuilder.tableId}</h3><span class="modal-close" data-close-ob>&times;</span></div>
    <div class="modal-body">
      <div class="field-row">
        <div style="flex:1;">
          ${cats.map(cat=>`
            <div class="pcat" style="margin-top:10px;">${cat}</div>
            ${available.filter(m=>m.cat===cat).map(m=>`
              <div class="pitem">
                <div style="display:flex; align-items:center; gap:8px;">
                  ${m.image ? `<img src="${m.image}" style="width:34px; height:34px; object-fit:cover; border-radius:4px; flex-shrink:0;">` : ''}
                  <div><div class="pn">${m.name}</div><div class="pp">${money(m.price)}</div></div>
                </div>
                <button class="btn small ghost" data-ob-add="${m.id}">Add</button>
              </div>`).join('')}
          `).join('')}
        </div>
        <div style="flex:1; border-left:1px solid var(--line); padding-left:16px;">
          <div class="pcat">Current order</div>
          ${orderBuilder.items.length===0 ? '<div class="empty" style="padding:10px 0;">No items yet</div>' :
            orderBuilder.items.map((it,i)=>`
            <div class="pitem">
              <div><div class="pn">${menuItem(it.itemId).name}</div>
                <select data-ob-course="${i}" style="margin-top:4px; font-size:11px; padding:2px;">
                  ${['Starter','Main','Dessert'].map(c=>`<option ${c===it.course?'selected':''}>${c}</option>`).join('')}
                </select>
              </div>
              <div class="qty-ctl">
                <button data-ob-dec="${i}">&minus;</button><span>${it.qty}</span><button data-ob-inc="${i}">+</button>
              </div>
            </div>`).join('')}
          <div class="kv total" style="margin-top:10px;"><span>Total</span><span>${money(total)}</span></div>
          <div class="field" style="margin-top:14px;"><label>Special note / dietary requirements</label>
            <textarea id="obNote" rows="3" placeholder="e.g. Nut allergy, no MSG, extra spicy...">${orderBuilder.note||''}</textarea>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" data-close-ob>Cancel</button>
      <button class="btn gold" data-ob-submit>${orderBuilder.items.length? 'Send order':'Add items'}</button>
    </div>
  </div>`;
}

function attachOrderBuilderHandlers(){
  document.querySelectorAll('[data-close-ob]').forEach(el=> el.onclick = ()=>{ orderBuilder=null; closeModal(); });
  document.querySelectorAll('[data-ob-add]').forEach(el=>{
    el.onclick = ()=>{
      const id = Number(el.dataset.obAdd);
      const existing = orderBuilder.items.find(x=>x.itemId===id);
      if(existing) existing.qty++; else orderBuilder.items.push({itemId:id, qty:1, course:'Main'});
      render();
    };
  });
  document.querySelectorAll('[data-ob-inc]').forEach(el=>{
    el.onclick = ()=>{ orderBuilder.items[Number(el.dataset.obInc)].qty++; render(); };
  });
  document.querySelectorAll('[data-ob-dec]').forEach(el=>{
    el.onclick = ()=>{
      const i = Number(el.dataset.obDec);
      orderBuilder.items[i].qty--;
      if(orderBuilder.items[i].qty<=0) orderBuilder.items.splice(i,1);
      render();
    };
  });
  document.querySelectorAll('[data-ob-course]').forEach(el=>{
    el.onchange = ()=>{ orderBuilder.items[Number(el.dataset.obCourse)].course = el.value; };
  });
  const noteInp = document.getElementById('obNote');
  if(noteInp) noteInp.oninput = (e)=>{ orderBuilder.note = e.target.value; };
  const submit = document.querySelector('[data-ob-submit]');
  if(submit) submit.onclick = async ()=>{
    if(orderBuilder.items.length===0) return;
    const t = tableById(orderBuilder.tableId);
    const apiItems = orderBuilder.items.map(it=>({menu_item_id:it.itemId, qty:it.qty, course:it.course}));
    submit.disabled = true;
    try{
      if(t.orderId){
        const updated = await apiFetch(`/orders/${t.orderId}/items`, {method:'PUT', body:JSON.stringify({items:apiItems, note:orderBuilder.note})});
        const o = orderById(t.orderId);
        Object.assign(o, mapOrder(updated));
      } else {
        const created = await apiFetch('/orders', {method:'POST', body:JSON.stringify({
          target_type:'table', target_id:t.id, items:apiItems, note:orderBuilder.note
        })});
        const order = mapOrder(created);
        state.orders.push(order);
        t.orderId = order.id;
      }
    }catch(err){ alert(err.message); submit.disabled = false; return; }
    t.status='occupied';
    showToast(`Order sent for Table ${t.id}`);
    orderBuilder=null;
    closeModal();
    state.view='orders'; render();
  };
}

/* patch modalHtml to include order builder */
const _origModalHtml = modalHtml;
modalHtml = function(){
  if(state.modal && state.modal.type==='orderBuilder') return orderBuilderHtml();
  return _origModalHtml();
};

render();
</script>
