<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Montra Nivesha — Table &amp; Room Service Management</title>
<style>
  :root{
    --navy:#1B2A3B;
    --navy-2:#233851;
    --midblue:#2E5F8A;
    --gold:#C8960C;
    --gold-soft:#E9C877;
    --cream:#F7F5F0;
    --paper:#FFFFFF;
    --ink:#20242B;
    --sub:#5B6472;
    --line:#DFDAD0;
    --st-available:#3F7D5C;
    --st-available-bg:#E7F1EB;
    --st-occupied:#B7472A;
    --st-occupied-bg:#F7E9E5;
    --st-reserved:#9A6B00;
    --st-reserved-bg:#FBF0DA;
    --st-cleaning:#6C7684;
    --st-cleaning-bg:#EBEDEF;
    --radius:4px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:Arial, Helvetica, sans-serif;
    background:var(--cream);
    color:var(--ink);
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  #app{display:flex; min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:212px; flex:0 0 212px;
    background:var(--navy);
    color:#D9DEE6;
    display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh;
  }
  .brand{
    padding:22px 18px 16px 18px;
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .brand-name{font-size:16px; font-weight:700; color:#fff; letter-spacing:.2px;}
  .brand-sub{font-size:11px; color:var(--gold-soft); margin-top:3px;}
  .nav{padding:10px 0; flex:1;}
  .nav-item{
    display:flex; align-items:center; gap:10px;
    padding:11px 18px; cursor:pointer;
    font-size:13.5px; color:#C6CCD6;
    border-left:3px solid transparent;
  }
  .nav-item .ic{width:16px; text-align:center; font-size:14px;}
  .nav-item:hover{background:var(--navy-2); color:#fff;}
  .nav-item.active{
    background:var(--navy-2); color:#fff;
    border-left:3px solid var(--gold);
    font-weight:700;
  }
  .role-box{
    margin:10px 14px 16px 14px; padding:10px 10px;
    background:rgba(255,255,255,.06); border-radius:var(--radius);
    font-size:11.5px; color:#AEB7C4;
  }
  .role-box select{
    width:100%; margin-top:6px; padding:6px 6px; font-size:12.5px;
    background:var(--navy-2); color:#fff; border:1px solid rgba(255,255,255,.15);
    border-radius:var(--radius); font-family:Arial;
  }

  /* ---------- Main ---------- */
  .main{flex:1; min-width:0; display:flex; flex-direction:column;}
  .topbar{
    background:var(--paper); border-bottom:1px solid var(--line);
    padding:16px 26px; display:flex; align-items:baseline; justify-content:space-between;
  }
  .topbar h1{
    font-size:20px; margin:0; font-weight:700; color:var(--navy);
    padding-bottom:8px; border-bottom:3px solid var(--gold); display:inline-block;
  }
  .topbar .meta{font-size:12px; color:var(--sub); text-align:right;}
  .content{padding:22px 26px; flex:1; overflow-y:auto;}

  .btn{
    display:inline-flex; align-items:center; gap:6px;
    padding:8px 14px; border-radius:var(--radius); border:1px solid var(--midblue);
    background:var(--midblue); color:#fff; font-size:13px; cursor:pointer; font-family:Arial;
  }
  .btn:hover{background:#26547A;}
  .btn.gold{background:var(--gold); border-color:var(--gold); color:#2A1E00;}
  .btn.gold:hover{background:#B3870B;}
  .btn.ghost{background:transparent; color:var(--midblue);}
  .btn.ghost:hover{background:#EEF3F7;}
  .btn.danger{background:var(--st-occupied); border-color:var(--st-occupied);}
  .btn.small{padding:5px 9px; font-size:12px;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}

  .section-block{margin-bottom:26px;}
  .section-head{
    display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px;
  }
  .section-head h2{font-size:15px; margin:0; color:var(--navy);}
  .section-head .desc{font-size:12px; color:var(--sub);}

  .floor-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(128px,1fr)); gap:12px;
  }
  .table-chip{
    border:1px solid var(--line); border-radius:var(--radius); background:var(--paper);
    padding:12px 10px; cursor:pointer; position:relative;
  }
  .table-chip:hover{border-color:var(--midblue);}
  .table-chip .tid{font-weight:700; font-size:14px; color:var(--navy);}
  .table-chip .cap{font-size:11px; color:var(--sub); margin-top:2px;}
  .status-pill{
    display:inline-block; font-size:10.5px; font-weight:700; padding:2px 7px;
    border-radius:10px; margin-top:8px; letter-spacing:.2px;
  }
  .pill-available{background:var(--st-available-bg); color:var(--st-available);}
  .pill-occupied{background:var(--st-occupied-bg); color:var(--st-occupied);}
  .pill-reserved{background:var(--st-reserved-bg); color:var(--st-reserved);}
  .pill-cleaning{background:var(--st-cleaning-bg); color:var(--st-cleaning);}
  .table-chip.st-available{border-left:4px solid var(--st-available);}
  .table-chip.st-occupied{border-left:4px solid var(--st-occupied);}
  .table-chip.st-reserved{border-left:4px solid var(--st-reserved);}
  .table-chip.st-cleaning{border-left:4px solid var(--st-cleaning);}
  .chip-sub{font-size:11px; color:var(--sub); margin-top:6px;}

  .legend{display:flex; gap:16px; font-size:12px; color:var(--sub); margin-bottom:16px;}
  .legend span{display:inline-flex; align-items:center; gap:5px;}
  .legend i{width:9px; height:9px; border-radius:2px; display:inline-block;}

  /* Kanban / KDS */
  .kanban{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
  .kcol{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); min-height:200px;}
  .kcol-head{padding:10px 12px; font-weight:700; font-size:12.5px; color:var(--navy); border-bottom:1px solid var(--line); display:flex; justify-content:space-between;}
  .kcard{margin:10px; padding:10px; border:1px solid var(--line); border-radius:var(--radius); background:#FCFBF8;}
  .kcard .khead{display:flex; justify-content:space-between; font-size:12.5px; font-weight:700; color:var(--navy);}
  .kcard .kitems{font-size:12px; color:var(--ink); margin:6px 0;}
  .kcard .kitems div{margin-bottom:2px;}
  .kcard .ktime{font-size:10.5px; color:var(--sub);}
  .kcard .kactions{margin-top:8px; display:flex; gap:6px;}

  table.data{width:100%; border-collapse:collapse; background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
  table.data th{
    text-align:left; font-size:11.5px; color:var(--sub); font-weight:700;
    padding:9px 12px; border-bottom:1px solid var(--line); background:#FBFAF7;
  }
  table.data td{padding:9px 12px; border-bottom:1px solid var(--line); font-size:13px; vertical-align:middle;}
  table.data tr:last-child td{border-bottom:none;}
  table.data tr:hover td{background:#FAFAF7;}

  .cards-row{display:grid; grid-template-columns:repeat(auto-fit, minmax(190px,1fr)); gap:14px; margin-bottom:20px;}
  .stat-card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px;}
  .stat-card .lbl{font-size:11.5px; color:var(--sub);}
  .stat-card .val{font-size:22px; font-weight:700; color:var(--navy); font-variant-numeric:tabular-nums; margin-top:4px;}
  .stat-card .sub{font-size:11px; color:var(--sub); margin-top:3px;}

  .bar-row{display:flex; align-items:center; gap:10px; margin-bottom:9px;}
  .bar-label{width:110px; font-size:12px; color:var(--sub); flex:0 0 110px;}
  .bar-track{flex:1; background:#EEEAE0; border-radius:3px; height:14px; position:relative;}
  .bar-fill{background:var(--midblue); height:100%; border-radius:3px;}
  .bar-val{width:70px; text-align:right; font-size:12px; font-variant-numeric:tabular-nums; color:var(--ink);}

  .tabs{display:flex; gap:2px; margin-bottom:16px; border-bottom:1px solid var(--line);}
  .tab{padding:9px 16px; font-size:13px; cursor:pointer; color:var(--sub); border-bottom:3px solid transparent;}
  .tab.active{color:var(--navy); font-weight:700; border-bottom:3px solid var(--gold);}

  .qr-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:14px;}
  .qr-card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:14px; text-align:center;}
  .qr-card img{width:120px; height:120px; margin-bottom:8px;}
  .qr-card .qname{font-weight:700; color:var(--navy); font-size:13px;}
  .qr-card .qsub{font-size:11px; color:var(--sub); margin-bottom:8px;}
  .qr-card .qactions{display:flex; gap:6px; justify-content:center; margin-top:8px;}

  /* Modal */
  .overlay{
    position:fixed; inset:0; background:rgba(20,24,30,.5);
    display:flex; align-items:flex-start; justify-content:center;
    padding:36px 16px; z-index:50; overflow-y:auto;
  }
  .modal{
    background:var(--paper); border-radius:var(--radius); width:100%; max-width:520px;
    box-shadow:0 12px 32px rgba(0,0,0,.22);
  }
  .modal.wide{max-width:640px;}
  .modal-head{
    padding:16px 20px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;
  }
  .modal-head h3{margin:0; font-size:15px; color:var(--navy);}
  .modal-close{cursor:pointer; color:var(--sub); font-size:18px; line-height:1;}
  .modal-body{padding:18px 20px;}
  .modal-foot{padding:14px 20px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:8px;}

  .field{margin-bottom:13px;}
  .field label{display:block; font-size:11.5px; color:var(--sub); margin-bottom:5px; font-weight:700;}
  .field input, .field select, .field textarea{
    width:100%; padding:8px 9px; border:1px solid var(--line); border-radius:var(--radius);
    font-family:Arial; font-size:13.5px; background:#FCFBF9;
  }
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    background:var(--navy); color:#fff; padding:11px 20px; border-radius:var(--radius);
    font-size:13px; z-index:80; box-shadow:0 6px 18px rgba(0,0,0,.25);
    border-left:4px solid var(--gold);
  }
  .warn-box{
    background:var(--st-occupied-bg); color:var(--st-occupied); border:1px solid #E7C3B8;
    padding:9px 11px; border-radius:var(--radius); font-size:12.5px; margin-bottom:12px;
  }
  .empty{color:var(--sub); font-size:13px; padding:30px 0; text-align:center;}

  /* Phone preview (customer QR view) */
  .phone{
    width:280px; margin:0 auto; border:8px solid var(--navy); border-radius:26px;
    background:var(--cream); overflow:hidden;
  }
  .phone-top{background:var(--navy); color:#fff; padding:12px 14px;}
  .phone-top .pname{font-weight:700; font-size:14px;}
  .phone-top .ploc{font-size:10.5px; color:var(--gold-soft); margin-top:2px;}
  .phone-body{max-height:380px; overflow-y:auto; padding:10px 12px;}
  .pcat{font-size:11px; font-weight:700; color:var(--midblue); margin:10px 0 6px 0; text-transform:uppercase; letter-spacing:.4px;}
  .pitem{display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-bottom:1px solid var(--line);}
  .pitem .pn{font-size:12.5px; font-weight:700;}
  .pitem .pp{font-size:11px; color:var(--sub);}
  .qty-ctl{display:flex; align-items:center; gap:7px;}
  .qty-ctl button{
    width:22px; height:22px; border-radius:50%; border:1px solid var(--midblue); background:#fff; color:var(--midblue);
    cursor:pointer; font-size:13px; line-height:1;
  }
  .phone-foot{padding:11px 14px; border-top:1px solid var(--line); background:#fff;}
  .cart-total{display:flex; justify-content:space-between; font-size:13px; font-weight:700; margin-bottom:8px;}

  .kv{display:flex; justify-content:space-between; font-size:13px; padding:5px 0; border-bottom:1px dashed var(--line);}
  .kv.total{font-weight:700; border-bottom:none; padding-top:9px; font-size:14.5px; color:var(--navy);}

  @media print{
    .sidebar,.topbar,.no-print{display:none !important;}
    .content{padding:0;}
    body{background:#fff;}
  }
  body.printing-modal > *:not(.overlay){ display:none !important; }
  body.printing-modal .overlay{ position:static !important; background:#fff !important; padding:0 !important; display:block !important; }
  body.printing-modal .modal-close, body.printing-modal .modal-foot{ display:none !important; }
  body.printing-modal .modal{ box-shadow:none !important; max-width:none !important; }
  @media (max-width:920px){
    .kanban{grid-template-columns:repeat(2,1fr);}
    .cards-row{grid-template-columns:repeat(2,1fr);}
  }

  /* ---------- Responsive: mobile & tablet ---------- */
  .hamburger-btn{
    display:none; background:none; border:none; font-size:22px; color:var(--navy);
    cursor:pointer; padding:2px 8px; line-height:1; margin-right:10px;
  }
  .sidebar-backdrop{ display:none; }
  @media (max-width:880px){
    .sidebar{
      position:fixed; left:0; top:0; height:100vh; z-index:60;
      transform:translateX(-100%); transition:transform .22s ease;
      box-shadow:2px 0 16px rgba(0,0,0,.3);
    }
    .sidebar.mobile-open{ transform:translateX(0); }
    .hamburger-btn{ display:inline-flex; align-items:center; }
    .sidebar-backdrop{
      display:block; position:fixed; inset:0; background:rgba(15,20,28,.45);
      z-index:55; opacity:0; pointer-events:none; transition:opacity .2s ease;
    }
    .sidebar-backdrop.show{ opacity:1; pointer-events:auto; }
    .topbar{ padding:14px 16px; }
    .content{ padding:16px; }
    .topbar h1{ font-size:17px; }
  }
  @media (max-width:640px){
    .field-row{ flex-direction:column; }
    .modal, .modal.wide{ max-width:calc(100% - 8px); }
    .overlay{ padding:14px 6px; }
    .topbar .meta{ display:none; }
    .cards-row{ grid-template-columns:repeat(2,1fr); }
    .kanban{ grid-template-columns:1fr; }
    table.data{ display:block; overflow-x:auto; -webkit-overflow-scrolling:touch; white-space:nowrap; }
    .floor-grid{ grid-template-columns:repeat(auto-fill, minmax(105px,1fr)); }
    .qr-grid{ grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =========================================================
   DATA MODEL
   ========================================================= */
const CURRENCY = "$";
const TAX_RATE = 0.10;     // VAT
const SERVICE_RATE = 0.10; // service charge

/* =========================================================
   API CLIENT — talks to the Montra Nivesha backend (Postgres + Express)
   ========================================================= */
const API_BASE = (typeof window !== 'undefined' && window.MONTRA_API_BASE) || 'http://localhost:4000/api';
let authToken = null;

async function apiFetch(path, opts={}){
  const headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  if(authToken) headers['Authorization'] = 'Bearer '+authToken;
  const res = await fetch(API_BASE+path, Object.assign({}, opts, {headers}));
  let data = null;
  try{ data = await res.json(); }catch(e){ /* 204 No Content etc. */ }
  if(!res.ok){
    const err = new Error((data && data.error) || res.statusText || 'Request failed');
    err.status = res.status; err.data = data;
    throw err;
  }
  return data;
}

/* ---- Adapters: API row shape -> the shape the rest of this app expects ---- */
function mapSection(s){
  return {id:s.id, name:s.name, desc:s.description||'', openTime:(s.open_time||'').slice(0,5), closeTime:(s.close_time||'').slice(0,5)};
}
function mapTable(t){
  return {id:t.id, section:t.section_id, capacity:t.capacity, status:t.status, orderId:null, reservationId:null};
}
function mapRoom(r){ return {id:r.id}; }
function mapMenuItem(m){
  return {id:m.id, name:m.name, cat:m.category, price:Number(m.price), cost:Number(m.cost),
          section:m.section_id||undefined, mods:m.modifiers||undefined, image:m.image||undefined};
}
function mapReservation(r){
  return {id:r.id, name:r.name, party:r.party, tableId:r.table_id,
          date:String(r.date).slice(0,10), time:String(r.time).slice(0,5), duration:r.duration,
          phone:r.phone||'', occasion:r.occasion||'', note:r.note||'', status:r.status, source:r.source};
}
function mapOrder(o){
  return {
    id:o.id, target:{type:o.target_type, id:o.target_id},
    items:(o.items||[]).map(it=>({itemId:it.menu_item_id, qty:it.qty, course:it.course})),
    note:o.note||'', status:o.status, createdAt:new Date(o.created_at).getTime()
  };
}
function mapVenue(v){ return {id:v.id, name:v.name, capacity:v.capacity, rentalFee:Number(v.rental_fee)}; }
function mapPackage(p){ return {id:p.id, name:p.name, pricePerGuest:Number(p.price_per_guest), cost:Number(p.cost_per_guest), description:p.description||''}; }
function mapService(s){ return {id:s.id, name:s.name, rate:Number(s.rate), cost:Number(s.cost), description:s.description||''}; }
function mapBusinessSource(s){ return {id:s.id, name:s.name}; }
function mapEvent(e){
  return {
    id:e.id, name:e.name, client:e.client||'', phone:e.phone||'',
    businessSource:e.business_source||'Direct / Walk-in', travelAgency:e.travel_agency||'', voucherNumber:e.voucher_number||'',
    venueId:e.venue_id, date:String(e.date).slice(0,10), startTime:String(e.start_time).slice(0,5), endTime:String(e.end_time).slice(0,5),
    guestCount:e.guest_count, packageId:e.package_id,
    venueRate: e.venue_rate!=null ? Number(e.venue_rate) : null,
    pkgRate: e.package_rate!=null ? Number(e.package_rate) : null,
    deposit:Number(e.deposit||0), note:e.note||'', status:e.status, invoiceStatus:e.invoice_status,
    extraServices:(e.extra_services||[]).map(x=>({serviceId:x.service_id, qty:x.qty}))
  };
}
function mapLedgerAccount(a){
  return {id:a.id, name:a.name, contact:a.contact||'', creditLimit:Number(a.credit_limit), balance:Number(a.balance), transactions:[]};
}
function mapStaff(s){ return {id:s.id, name:s.name, username:s.username, role:s.role, shift:s.shift||''}; }

// Loads everything the currently-signed-in role has permission to see.
// Uses allSettled so a role that's blocked from, say, /catering (a 403)
// doesn't stop tables/orders/menu from loading — those endpoints are
// simply skipped and the local defaults stay in place for that user.
async function loadCoreData(){
  const specs = [
    ['sections', '/sections'], ['tables', '/tables'], ['rooms', '/rooms'],
    ['menu', '/menu'], ['reservations', '/reservations'], ['orders', '/orders'],
    ['venues', '/catering/venues'], ['packages', '/catering/packages'],
    ['services', '/catering/services'], ['businessSources', '/catering/business-sources'],
    ['events', '/catering/events'], ['ledgerAccounts', '/city-ledger/accounts'],
    ['roomFoliosApi', '/city-ledger/room-folios'], ['staffList', '/staff'],
  ];
  const results = await Promise.allSettled(specs.map(([, path]) => apiFetch(path)));
  const got = {};
  specs.forEach(([key], i) => { if(results[i].status==='fulfilled') got[key] = results[i].value; });

  if(got.sections) state.sections = got.sections.map(mapSection);
  if(got.tables) state.tables = got.tables.map(mapTable);
  if(got.rooms) state.rooms = got.rooms.map(mapRoom);
  if(got.menu) state.menu = got.menu.map(mapMenuItem);
  if(got.reservations) state.reservations = got.reservations.map(mapReservation);
  if(got.orders) state.orders = got.orders.map(mapOrder);
  if(got.venues) state.venues = got.venues.map(mapVenue);
  if(got.packages) state.cateringPackages = got.packages.map(mapPackage);
  if(got.services) state.additionalServices = got.services.map(mapService);
  if(got.businessSources) state.businessSources = got.businessSources.map(mapBusinessSource);
  if(got.events) state.events = got.events.map(mapEvent);
  if(got.ledgerAccounts) state.cityLedgerAccounts = got.ledgerAccounts.map(mapLedgerAccount);
  if(got.roomFoliosApi){
    const folios = {};
    got.roomFoliosApi.forEach(f=>{ folios[f.room_id] = {charges:[], balance:Number(f.balance)}; });
    state.roomFolios = folios;
  }
  if(got.staffList) state.staff = got.staffList.map(mapStaff);
  relinkTableOrders();
}
function relinkTableOrders(){
  state.tables.forEach(t=>{
    const open = state.orders.find(o=> o.target.type==='table' && o.target.id===t.id && o.status!=='paid');
    t.orderId = open ? open.id : null;
  });
}

// Lightweight polling so a second device sees table/order changes without
// a manual refresh. Only runs while a staff user is signed in.
let pollHandle = null;
function startPolling(){
  if(pollHandle) return;
  pollHandle = setInterval(async ()=>{
    if(!state.currentUser || state.modal) return; // don't yank the floor out from under an open modal
    try{
      const [tables, orders] = await Promise.all([apiFetch('/tables'), apiFetch('/orders')]);
      state.tables = tables.map(mapTable);
      state.orders = orders.map(mapOrder);
      relinkTableOrders();
      if(state.view==='floorplan' || state.view==='orders') render();
    }catch(e){ /* transient network hiccup — try again on the next tick */ }
  }, 6000);
}


const SECTIONS = [
  {id:'sk', name:'Amok Khmer Cuisine', desc:'Indoor fine dining open air', openTime:'11:00', closeTime:'22:00'},
  {id:'sr', name:'Sokhalay', desc:'Private dining rooms with air-conditioned', openTime:'17:00', closeTime:'22:00'},
  {id:'af', name:'Arun', desc:'Indoor fine dining, air-conditioned', openTime:'06:00', closeTime:'10:00'}
];

function buildTables(){
  const layout = {
    sk:[2,2,4,4,4,4,6,6],

function restaurantStatsForDate(dateStr){
  // Uses whatever's in state.orders — loaded fully from the API at login and
  // kept fresh by polling, so this now covers real history, not just "today".
  const paid = state.orders.filter(o=>o.status==='paid' && new Date(o.createdAt).toISOString().slice(0,10)===dateStr);
  let revenue=0, foodCost=0;
  paid.forEach(o=>{
    const {total} = orderTotal(o);
    revenue += total;
    o.items.forEach(it=>{ const mi = menuItem(it.itemId); if(mi) foodCost += mi.cost*it.qty; });
  });
  return {revenue, foodCost, orders:paid.length};
}
function eventsRevenueForDate(dateStr){
  const paidEvents = state.events.filter(ev=> ev.date===dateStr && ev.invoiceStatus==='Paid');
  let revenue=0;
  paidEvents.forEach(ev=>{ revenue += eventTotal(ev).total; });
  return {revenue, count:paidEvents.length};
}
function dayStats(dateStr){
  const rest = restaurantStatsForDate(dateStr);
  const ev = eventsRevenueForDate(dateStr);
  return {
    revenue: rest.revenue+ev.revenue, foodCost: rest.foodCost, orders: rest.orders,
    restaurantRevenue: rest.revenue, eventsRevenue: ev.revenue, eventsCount: ev.count
  };
}
function daysInMonth(monthKey){
  const [y,m] = monthKey.split('-').map(Number);
  return new Date(y, m, 0).getDate();
}
function monthStats(monthKey){
  const dim = daysInMonth(monthKey);
  let revenue=0, foodCost=0, orders=0, restaurantRevenue=0, eventsRevenue=0, eventsCount=0;
  for(let d=1; d<=dim; d++){
    const s = dayStats(`${monthKey}-${String(d).padStart(2,'0')}`);
    revenue+=s.revenue; foodCost+=s.foodCost; orders+=s.orders;
    restaurantRevenue+=s.restaurantRevenue; eventsRevenue+=s.eventsRevenue; eventsCount+=s.eventsCount;
  }
  return {revenue, foodCost, orders, restaurantRevenue, eventsRevenue, eventsCount};
}
function yearStats(yearKey){
  let revenue=0, foodCost=0, orders=0, restaurantRevenue=0, eventsRevenue=0, eventsCount=0;
  for(let m=1; m<=12; m++){
    const s = monthStats(`${yearKey}-${String(m).padStart(2,'0')}`);
    revenue+=s.revenue; foodCost+=s.foodCost; orders+=s.orders;

function timeToMin(t){ const [h,m]=t.split(':').map(Number); return h*60+m; }
function formatTime12(t){
  if(!t) return '';
  const [h,m] = t.split(':').map(Number);
  const period = h>=12 ? 'PM' : 'AM';
  const h12 = h%12===0 ? 12 : h%12;
  return `${h12}:${String(m).padStart(2,'0')} ${period}`;
}
function sectionHoursLabel(sectionId){
  const sec = state.sections.find(s=>s.id===sectionId);
  if(!sec || !sec.openTime) return '';
  return `${formatTime12(sec.openTime)}–${formatTime12(sec.closeTime)}`;
}
function withinSectionHours(sectionId, startTime, duration){
  const sec = state.sections.find(s=>s.id===sectionId);
  if(!sec || !sec.openTime || !sec.closeTime) return true;
  const openM = timeToMin(sec.openTime), closeM = timeToMin(sec.closeTime);
  const startM = timeToMin(startTime), endM = startM+Number(duration);
  return startM>=openM && endM<=closeM;
}
function reservationConflict(tableId, date, time, duration, excludeId){
  const start = timeToMin(time), end = start+Number(duration);
  return state.reservations.some(r=>{
    if(r.id===excludeId) return false;
    if(r.tableId!==tableId || r.date!==date) return false;
    if(r.status==='cancelled') return false;
    const rs = timeToMin(r.time), re = rs+Number(r.duration);
    return start < re && rs < end; // overlap
  });
}

function eventConflict(venueId, date, startTime, endTime, excludeId){
  const start = timeToMin(startTime), end = timeToMin(endTime);
  return state.events.some(ev=>{
    if(ev.id===excludeId) return false;
    if(ev.venueId!==venueId || ev.date!==date) return false;
    if(ev.status==='cancelled') return false;
    const es = timeToMin(ev.startTime), ee = timeToMin(ev.endTime);
    return start < ee && es < end; // overlap
  });
}
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i], next = text[i+1];
    if(inQuotes){
      if(c==='"' && next==='"'){ field+='"'; i++; }
      else if(c==='"'){ inQuotes=false; }
      else { field+=c; }
    } else {
      if(c==='"'){ inQuotes=true; }
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\r'){ /* skip */ }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else { field+=c; }
    }
  }
  if(field.length>0 || row.length>0){ row.push(field); rows.push(row); }
  return rows.filter(r=> !(r.length===1 && r[0].trim()===''));
}

function importEventsFromCSV(text){
  const rows = parseCSV(text);
  if(rows.length<2) return {added:0, skipped:0, reasons:[]};
  const header = rows[0].map(h=>h.trim().toLowerCase());
  const idx = (name)=> header.indexOf(name.toLowerCase());
  let added=0, skipped=0; const reasons=[];
  for(let r=1;r<rows.length;r++){
    const row = rows[r];
    if(row.every(c=>(c||'').trim()==='')) continue;
    const get = (name)=>{ const i=idx(name); return i>=0 ? (row[i]||'').trim() : ''; };
    const name = get('Event Name') || get('Name');
    if(!name){ skipped++; reasons.push(`Row ${r+1}: missing event name`); continue; }
    const venueName = get('Venue');
    const venue = state.venues.find(v=>v.name.toLowerCase()===venueName.toLowerCase());
    if(!venue){ skipped++; reasons.push(`Row ${r+1} (${name}): venue "${venueName}" not found`); continue; }
    const pkgName = get('Package');
    const pkg = state.cateringPackages.find(p=>p.name.toLowerCase()===pkgName.toLowerCase());
    if(!pkg){ skipped++; reasons.push(`Row ${r+1} (${name}): package "${pkgName}" not found`); continue; }
    const extrasRaw = get('Extra Services');
    const extraServices = extrasRaw ? extrasRaw.split(';').map(s=>s.trim()).filter(Boolean).map(pair=>{
      const i = pair.lastIndexOf(':');
      const svcName = i>-1 ? pair.slice(0,i).trim() : pair;
      const qty = i>-1 ? Number(pair.slice(i+1).trim())||1 : 1;
      const svc = state.additionalServices.find(s=>s.name.toLowerCase()===svcName.toLowerCase());
      return svc ? {serviceId:svc.id, qty} : null;
    }).filter(Boolean) : [];
    const statusRaw = get('Status');
    const status = ['Inquiry','Confirmed','Completed','Cancelled'].includes(statusRaw) ? statusRaw : 'Inquiry';
    const venueRateStr = get('Venue Rate'), pkgRateStr = get('Package Rate');
    const ev = {
      id: state.nextEventId++,
      name, client: get('Client'), phone: get('Phone'),
      businessSource: get('Business Source') || 'Direct / Walk-in',
      travelAgency: get('Travel Agency'), voucherNumber: get('Voucher Number'),
      venueId: venue.id, date: get('Date'), startTime: get('Start Time')||'18:00', endTime: get('End Time')||'22:00',
      guestCount: Number(get('Guests'))||1, packageId: pkg.id,
      venueRate: venueRateStr!=='' ? Number(venueRateStr) : undefined,
      pkgRate: pkgRateStr!=='' ? Number(pkgRateStr) : undefined,
      extraServices, deposit: Number(get('Deposit'))||0, note: get('Note'), status,
      invoiceStatus: get('Invoice Status')==='Paid' ? 'Paid' : undefined
    };
    state.events.push(ev);
    added++;
  }
  return {added, skipped, reasons};
}

function eventTotal(ev){
  // Venue rental, catering, and additional services rates are all-inclusive (VAT &
  // service charge already baked in), same convention as menu prices. We back both
  // portions out of the gross amount for a transparent invoice, but nothing further
  // is added on top.
  const venue = state.venues.find(v=>v.id===ev.venueId);
  const pkg = state.cateringPackages.find(p=>p.id===ev.packageId);
  const rentalRate = (ev.venueRate!=null) ? ev.venueRate : (venue ? venue.rentalFee : 0);
  const priceRate = (ev.pkgRate!=null) ? ev.pkgRate : (pkg ? pkg.pricePerGuest : 0);
  const catering = priceRate*ev.guestCount;
  const rental = rentalRate;
  const extraLines = (ev.extraServices||[]).map(es=>{
    const svc = state.additionalServices.find(s=>s.id===es.serviceId);
    return {service:svc, qty:es.qty, amount: svc ? svc.rate*es.qty : 0};
  }).filter(l=>l.qty>0);
  const extras = extraLines.reduce((s,l)=>s+l.amount, 0);
  const subtotal = catering+rental+extras; // gross, VAT & service incl.
  const net = subtotal / ((1+SERVICE_RATE)*(1+TAX_RATE));
  const service = net*SERVICE_RATE;
  const vatIncluded = subtotal - net - service;
  return {catering, rental, extras, extraLines, subtotal, net, service, vatIncluded, total: subtotal};
}

function orderTotal(order){
  // Menu prices are all-inclusive: VAT and service charge are already baked in.
  // Convention: net price -> +10% service -> +10% VAT on (net+service) = gross.
  // We back both portions out of the gross price for a transparent invoice, but
  // nothing further is added on top — the menu price is exactly what's paid.
  let sub=0;
  order.items.forEach(it=>{
    const mi = menuItem(it.itemId);
    if(mi) sub += mi.price*it.qty;
  });
  const net = sub / ((1+SERVICE_RATE)*(1+TAX_RATE));
  const service = net*SERVICE_RATE;
  const vatIncluded = sub - net - service;
  return {sub, net, service, vatIncluded, total: sub};
}

function attachLoginHandlers(){
  const btn = document.getElementById('loginBtn');
  const tryLogin = async ()=>{
    const u = document.getElementById('loginUser').value.trim();
    const p = document.getElementById('loginPass').value;
    if(!u || !p){ state.loginError = 'Enter a username and password.'; render(); return; }
    btn.disabled = true; btn.textContent = 'Signing in…';
    try{
      const data = await apiFetch('/auth/login', {method:'POST', body:JSON.stringify({username:u, password:p})});
      authToken = data.token;
      state.currentUser = {id:data.user.id, name:data.user.name, username:data.user.username, role:data.user.role, shift:data.user.shift};
      state.role = data.user.role;
      state.rolePermissions[data.user.role] = data.permissions;
      state.loginError = '';
      await loadCoreData();
      startPolling();
      render();
    }catch(err){
      state.loginError = err.message || 'Incorrect username or password.';
      render();
    }
  };
  btn.onclick = tryLogin;
  ['loginUser','loginPass'].forEach(id=>{
    document.getElementById(id).addEventListener('keydown', e=>{ if(e.key==='Enter') tryLogin(); });
  });
  const guestLink = document.getElementById('guestBookLink');
  if(guestLink) guestLink.onclick = async (e)=>{
    e.preventDefault();
    state.guestBooking = true; state.guestStep='search';
    try{ const sections = await apiFetch('/public/sections'); state.sections = sections.map(mapSection); }catch(err){ /* fall back to local defaults */ }
    render();
  };
  const feedbackLink = document.getElementById('guestFeedbackLink');
  if(feedbackLink) feedbackLink.onclick = (e)=>{ e.preventDefault(); state.guestFeedbackMode = true; render(); };
}

function findAvailableTables(date, time, party, duration){
  return state.tables
    .filter(t=> t.capacity >= party)
    .filter(t=> withinSectionHours(t.section, time, duration))
    .filter(t=> !reservationConflict(t.id, date, time, duration, null))
    .sort((a,b)=> a.capacity - b.capacity);
}

function attachGuestHandlers(){
  const backLink = document.getElementById('backToStaffLink');
  if(backLink) backLink.onclick = (e)=>{ e.preventDefault(); state.guestBooking=false; render(); };
  document.querySelectorAll('[data-gtab]').forEach(el=>{
    el.onclick = ()=>{ state.guestStep = el.dataset.gtab==='manage' ? 'manage' : 'search'; render(); };
  });

  const searchBtn = document.getElementById('gSearchBtn');
  if(searchBtn) searchBtn.onclick = async ()=>{
    state.guestSearch.date = document.getElementById('gDate').value;
    state.guestSearch.time = document.getElementById('gTime').value;
    state.guestSearch.party = Number(document.getElementById('gParty').value)||1;
    const g = state.guestSearch;
    try{
      const rows = await apiFetch('/public/availability', {method:'POST', body:JSON.stringify({
        date:g.date, time:g.time, party:g.party, duration:90
      })});
      state.guestAvailableTables = rows.map(t=>({id:t.id, section:t.section_id, capacity:t.capacity}));
    }catch(err){ state.guestAvailableTables = []; }
    state.guestStep = 'results';
    render();
  };
  const backSearch = document.getElementById('gBackSearch');
  if(backSearch) backSearch.onclick = (e)=>{ e.preventDefault(); state.guestStep='search'; render(); };
  document.querySelectorAll('[data-select-table]').forEach(el=>{
    el.onclick = ()=>{ state.guestSelectedTable = el.dataset.selectTable; state.guestStep='details'; render(); };
  });
  const joinWaitlistLink = document.getElementById('gJoinWaitlist');
  if(joinWaitlistLink) joinWaitlistLink.onclick = ()=>{ state.guestStep='waitlist'; render(); };

  const backResults = document.getElementById('gBackResults');
  if(backResults) backResults.onclick = (e)=>{ e.preventDefault(); state.guestStep='results'; render(); };
  const confirmBtn = document.getElementById('gConfirmBtn');
  if(confirmBtn) confirmBtn.onclick = async ()=>{
    const name = document.getElementById('gName').value.trim();
    const phone = document.getElementById('gPhone').value.trim();
    const occasion = document.getElementById('gOcc').value.trim();
    const note = document.getElementById('gNote').value.trim();
    if(!name || !phone){ alert('Please provide your name and phone number.'); return; }
    const g = state.guestSearch;
    let created;
    try{
      created = await apiFetch('/public/reservations', {method:'POST', body:JSON.stringify({
        name, phone, party:g.party, table_id:state.guestSelectedTable, date:g.date, time:g.time, occasion, note
      })});
    }catch(err){
      alert(err.message);
      state.guestStep='results'; render(); return;
    }
    const r = mapReservation(created);
    state.guestConfirmedRes = r;
    state.guestStep = 'confirmed';
    render();
  };

  const newBookingBtn = document.getElementById('gNewBooking');
  if(newBookingBtn) newBookingBtn.onclick = ()=>{ state.guestStep='search'; state.guestConfirmedRes=null; render(); };

  const waitlistBtn = document.getElementById('gWaitlistBtn');
  if(waitlistBtn) waitlistBtn.onclick = async ()=>{
    const name = document.getElementById('gwName').value.trim();
    const phone = document.getElementById('gwPhone').value.trim();
    if(!name || !phone){ alert('Please provide your name and phone number.'); return; }
    const g = state.guestSearch;
    try{
      await apiFetch('/public/waitlist', {method:'POST', body:JSON.stringify({name, phone, party:g.party, date:g.date, time:g.time})});
    }catch(err){ alert(err.message); return; }
    showToast('Added to the waitlist — we will call you if a table opens up.');
    state.guestStep='search';
    render();
  };

  const manageSearchBtn = document.getElementById('gManageSearchBtn');
  if(manageSearchBtn) manageSearchBtn.onclick = async ()=>{
    const phone = document.getElementById('gManagePhone').value.trim();
    state.guestManagePhone = phone;
    try{
      const rows = await apiFetch(`/public/reservations?phone=${encodeURIComponent(phone)}`);
      state.guestManageResults = rows.map(mapReservation);
    }catch(err){ state.guestManageResults = []; }
    render();
  };
  document.querySelectorAll('[data-guest-cancel]').forEach(el=>{
    el.onclick = async ()=>{
      const r = state.guestManageResults.find(x=>x.id===Number(el.dataset.guestCancel));
      if(!confirm('Cancel this booking?')) return;
      try{
        await apiFetch(`/public/reservations/${r.id}/cancel`, {method:'PUT', body:JSON.stringify({phone:r.phone})});
      }catch(err){ alert(err.message); return; }
      r.status='cancelled';
      render();
    };
  });
}

    state.guestFeedbackForm = {name:'', contact:'', visitType:'Dine-in', ref:'', overallRating:0, foodRating:0, serviceRating:0, comment:''};
    render();
  };
  document.querySelectorAll('[data-star-field]').forEach(el=>{
    el.onclick = ()=>{
      // Preserve whatever the guest already typed before this re-render.
      const f = state.guestFeedbackForm;
      const nameEl = document.getElementById('fbName');
      if(nameEl){
        f.name = nameEl.value;
        f.contact = document.getElementById('fbContact').value;
        f.visitType = document.getElementById('fbVisitType').value;
        f.ref = document.getElementById('fbRef').value;
        f.comment = document.getElementById('fbComment').value;
      }
      f[el.dataset.starField] = Number(el.dataset.starValue);
      render();
    };
  });
  const submitBtn = document.getElementById('fbSubmitBtn');
  if(submitBtn) submitBtn.onclick = async ()=>{
    const f = state.guestFeedbackForm;
    f.name = document.getElementById('fbName').value.trim();
    f.contact = document.getElementById('fbContact').value.trim();
    f.visitType = document.getElementById('fbVisitType').value;
    f.ref = document.getElementById('fbRef').value.trim();
    f.comment = document.getElementById('fbComment').value.trim();
    if(f.overallRating===0){ alert('Please give an overall rating before submitting.'); return; }
    try{
      await apiFetch('/public/feedback', {method:'POST', body:JSON.stringify({
        name:f.name||'Anonymous guest', contact:f.contact, visit_type:f.visitType, ref:f.ref,
        overall_rating:f.overallRating, food_rating:f.foodRating||null, service_rating:f.serviceRating||null,
        comment:f.comment
      })});
    }catch(err){ alert(err.message); return; }
    state.guestFeedbackSubmitted = true;
    render();
  };
}

function floorPlanHtml(){
  const counts = {available:0,occupied:0,reserved:0,cleaning:0};
  state.tables.forEach(t=>counts[t.status]++);
  const canEdit = state.role==='admin';
  let html = `
  <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:4px;">
    <div class="legend">
      <span><i style="background:var(--st-available)"></i>Available (${counts.available})</span>
      <span><i style="background:var(--st-occupied)"></i>Occupied (${counts.occupied})</span>
      <span><i style="background:var(--st-reserved)"></i>Reserved (${counts.reserved})</span>
      <span><i style="background:var(--st-cleaning)"></i>Cleaning (${counts.cleaning})</span>
    </div>
    ${canEdit ? `<button class="btn ${state.floorPlanEdit?'gold':'ghost'}" id="editFloorBtn">${state.floorPlanEdit? 'Done Editing' : 'Edit Floor Plan'}</button>` : ''}
  </div>
  ${state.floorPlanEdit ? `<div class="warn-box" style="background:var(--st-reserved-bg); color:var(--st-reserved); border-color:#EAD9AE;">Editing layout: drag tables to reorder or move between sections, use &times; to remove a table, or add a new one per section.</div>` : ''}
  `;
  state.sections.forEach(sec=>{
    const tables = state.tables.filter(t=>t.section===sec.id);
    html += `
    <div class="section-block">
      <div class="section-head"><h2>${sec.name}</h2><span class="desc">${sec.desc} &middot; ${sectionHoursLabel(sec.id)}</span></div>
      <div class="floor-grid" data-section-grid="${sec.id}">
        ${tables.map(t=>tableChip(t)).join('')}
        ${state.floorPlanEdit ? `<div class="table-chip add-tile" data-add-table="${sec.id}" style="display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--midblue); border-style:dashed;">+ Add table</div>` : ''}
      </div>
    </div>`;
  });
  return html;
}

function tableChip(t){
  const order = t.orderId ? orderById(t.orderId) : null;
  let sub = `${t.capacity} seats`;
  if(t.status==='occupied' && order) sub = `Order #${order.id} &middot; ${order.items.length} item(s)`;
  if(t.status==='reserved'){
    const r = state.reservations.find(r=>r.tableId===t.id && r.status==='confirmed');
    if(r) sub = `${r.time} &middot; ${r.name}`;
  }
  const editAttrs = state.floorPlanEdit ? `draggable="true" data-drag-table="${t.id}"` : '';
  return `
  <div class="table-chip st-${t.status}" data-table="${t.id}" ${editAttrs} style="${state.floorPlanEdit?'cursor:grab;':''}">
    ${state.floorPlanEdit ? `<span data-del-table="${t.id}" style="position:absolute; top:6px; right:8px; color:var(--st-occupied); font-weight:700; cursor:pointer;">&times;</span>` : ''}
    <div class="tid">${t.id}</div>
    <div class="cap">${t.capacity} seats</div>
    <span class="status-pill pill-${t.status}">${t.status.toUpperCase()}</span>
    <div class="chip-sub">${sub}</div>
  </div>`;
}

function attachViewHandlers(){
  if(state.view==='floorplan'){
    document.querySelectorAll('[data-table]').forEach(el=>{
      el.onclick = (e)=>{
        if(state.floorPlanEdit) return; // clicks in edit mode are for drag/delete, not detail
        openModal({type:'table', id:el.dataset.table});
      };
    });
    const editBtn = document.getElementById('editFloorBtn');
    if(editBtn) editBtn.onclick = ()=>{ state.floorPlanEdit = !state.floorPlanEdit; render(); };

    document.querySelectorAll('[data-del-table]').forEach(el=>{
      el.onclick = async (e)=>{
        e.stopPropagation();
        const id = el.dataset.delTable;
        const t = tableById(id);
        if(t.status==='occupied' && !confirm(`Table ${id} has an open order. Remove it anyway?`)) return;
        try{ await apiFetch(`/tables/${encodeURIComponent(id)}`, {method:'DELETE'}); }
        catch(err){ alert(err.message); return; }
        state.tables = state.tables.filter(x=>x.id!==id);
        showToast(`Table ${id} removed`);
        render();
      };
    });

    document.querySelectorAll('[data-add-table]').forEach(el=>{
      el.onclick = async ()=>{
        const secId = el.dataset.addTable;
        const cap = Number(prompt('Capacity (seats) for the new table?', '4')) || 4;
        const id = nextTableIdForSection(secId);
        try{
          await apiFetch('/tables', {method:'POST', body:JSON.stringify({id, section_id:secId, capacity:cap})});
        }catch(err){ alert(err.message); return; }
        const newTable = {id, section:secId, capacity:cap, status:'available', orderId:null, reservationId:null};
        state.tables.push(newTable);
        showToast(`${newTable.id} added to ${sectionName(secId)}`);
        render();
      };
    });

    // drag and drop
    document.querySelectorAll('[data-drag-table]').forEach(el=>{
      el.addEventListener('dragstart', (e)=>{
        state.dragTableId = el.dataset.dragTable;
        e.dataTransfer.effectAllowed = 'move';
      });
    });
    document.querySelectorAll('[data-section-grid]').forEach(grid=>{
      grid.addEventListener('dragover', (e)=>{ e.preventDefault(); });
      grid.addEventListener('drop', (e)=>{
        e.preventDefault();
        if(!state.dragTableId) return;
        const dragged = tableById(state.dragTableId);
        const targetSection = grid.dataset.sectionGrid;
        const chipUnder = e.target.closest('.table-chip:not(.add-tile)');
        state.tables = state.tables.filter(t=>t.id!==dragged.id);
        dragged.section = targetSection;
        if(chipUnder && chipUnder.dataset.table && chipUnder.dataset.table!==dragged.id){
          const idx = state.tables.findIndex(t=>t.id===chipUnder.dataset.table);
          state.tables.splice(idx,0,dragged);
        } else {
          // append at end of that section: insert before first table of next section, or push
          let insertAt = state.tables.length;
          const sectionOrder = state.sections.map(s=>s.id);
          const targetPos = sectionOrder.indexOf(targetSection);
          for(let i=0;i<state.tables.length;i++){
            if(sectionOrder.indexOf(state.tables[i].section) > targetPos){ insertAt = i; break; }
          }
          state.tables.splice(insertAt,0,dragged);
        }
        state.dragTableId = null;
        render();
      });
    });
  }
  if(state.view==='orders'){
    document.querySelectorAll('[data-advance]').forEach(el=>{
      el.onclick = ()=> advanceItem(el.dataset.advance, Number(el.dataset.idx));
    });
    document.querySelectorAll('[data-bill]').forEach(el=>{
      el.onclick = ()=> openModal({type:'bill', orderId:Number(el.dataset.bill), method:'cash'});
    });
  }
  if(state.view==='reservations'){
    const btn = document.getElementById('newResBtn');
    if(btn) btn.onclick = ()=> openModal({type:'reservation'});
    document.querySelectorAll('[data-cancel-res]').forEach(el=>{
      el.onclick = async ()=>{
        const r = state.reservations.find(r=>r.id===Number(el.dataset.cancelRes));
        try{ await apiFetch(`/reservations/${r.id}/cancel`, {method:'PUT'}); }
        catch(err){ alert(err.message); return; }
        r.status='cancelled';
        const t = tableById(r.tableId);
        if(t && t.status==='reserved') t.status='available';
        showToast(`Reservation for ${r.name} cancelled`);
        render();
      };
    });
  }
  if(state.view==='menu'){
    const btn = document.getElementById('newItemBtn');

    document.querySelectorAll('[data-del-staff]').forEach(el=>{
      el.onclick = async ()=>{
        const id = Number(el.dataset.delStaff);
        if(id===state.currentUser.id) return;
        if(!confirm('Remove this staff account?')) return;
        try{ await apiFetch(`/staff/${id}`, {method:'DELETE'}); }

    document.querySelectorAll('[data-perm-role]').forEach(el=>{

        const granted = el.checked;
        try{
          await apiFetch('/staff/permissions', {method:'PUT', body:JSON.stringify({role, function:fn, granted})});
        }catch(err){ alert(err.message); el.checked = !granted; return; }

/* =========================================================
   VIEW: ORDERS & KDS
   ========================================================= */
const STAGES = ['New','Preparing','Ready','Served'];
function ordersHtml(){
  const active = state.orders.filter(o=>o.status!=='paid');
  if(active.length===0){
    return `<div class="empty">No active orders. New orders from the floor or a QR scan will appear here.</div>`;
  }
  let html = `<div class="kanban">`;
  STAGES.forEach(stage=>{
    const inStage = active.filter(o=>o.status===stage);
    html += `<div class="kcol">
      <div class="kcol-head"><span>${stage}</span><span>${inStage.length}</span></div>
      ${inStage.map(o=>orderCard(o,stage)).join('') || ''}
    </div>`;
  });
  html += `</div>`;
  return html;
}

function orderCard(o, stage){
  const t = o.target.type==='table' ? `Table ${o.target.id}` : `Room ${o.target.id} (room service)`;
  const nextStage = STAGES[STAGES.indexOf(stage)+1];
  return `
  <div class="kcard">
    <div class="khead"><span>#${o.id} &middot; ${t}</span><span class="ktime">${timeAgo(o.createdAt)}</span></div>
    <div class="kitems">
      ${o.items.map(it=>`<div>${it.qty}&times; ${menuItem(it.itemId)?.name || 'Item'} <span style="color:var(--sub)">(${it.course})</span></div>`).join('')}
    </div>
    ${o.note ? `<div style="background:var(--st-occupied-bg); color:var(--st-occupied); border:1px solid #E7C3B8; border-radius:var(--radius); padding:6px 8px; font-size:11.5px; margin-bottom:8px;"><strong>&#9888; Note:</strong> ${o.note}</div>` : ''}
    <div class="kactions">
      ${nextStage ? `<button class="btn small" data-advance="${o.id}">Move to ${nextStage}</button>` : ''}
      ${stage==='Served' ? `<button class="btn small gold" data-bill="${o.id}">Generate Bill</button>` : ''}
    </div>
  </div>`;
}

async function advanceItem(orderId){
  const o = orderById(Number(orderId));
  const idx = STAGES.indexOf(o.status);
  if(idx>=STAGES.length-1) return;
  const nextStatus = STAGES[idx+1];
  try{
    await apiFetch(`/orders/${o.id}/status`, {method:'PUT', body:JSON.stringify({status:nextStatus})});
  }catch(err){ alert(err.message); return; }
  o.status = nextStatus;
  render();
}

    rangeLabel = new Date(state.reportDate+'T00:00:00').toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'});

      `<div class="empty">Item-level detail (revenue by section, top items) is only tracked for today's live orders. Past days show settled totals only.</div>`;
    chart = `${sourceBreakdownHtml(stats)}${detail}`;
  } else if(period==='monthly'){
    stats = monthStats(state.reportMonth);
    const [y,m] = state.reportMonth.split('-').map(Number);
    rangeLabel = new Date(y, m-1, 1).toLocaleDateString(undefined,{year:'numeric',month:'long'});
    const dim = daysInMonth(state.reportMonth);
    const days = [];
    for(let d=1; d<=dim; d++){
      const dateStr = `${state.reportMonth}-${String(d).padStart(2,'0')}`;
      days.push({label:String(d), val: dayStats(dateStr).revenue});
    }
    const maxVal = Math.max(1, ...days.map(d=>d.val));
    chart = `
    ${sourceBreakdownHtml(stats)}
    <div class="section-block">
      <div class="section-head"><h2>Daily Revenue — ${rangeLabel}</h2></div>
      ${days.map(d=>`
      <div class="bar-row">
        <div class="bar-label">Day ${d.label}</div>

        <div class="bar-val">${money(d.val)}</div>
      </div>`).join('')}
    </div>`;
  } else { // yearly
    stats = yearStats(state.reportYear);

    const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const months = [];
    for(let m=1; m<=12; m++){

      <div class="bar-row">

        <div class="bar-track"><div class="bar-fill" style="width:${(m.val/maxVal*100)}%"></div></div>
        <div class="bar-val">${money(m.val)}</div>
      </div>`).join('')}

  const foodCostPct = stats.restaurantRevenue>0 ? (stats.foodCost/stats.restaurantRevenue*100) : 0;

  return `
  <div class="tabs">
    <div class="tab ${period==='daily'?'active':''}" data-reporttab="daily">Daily</div>

function downloadCSV(filename, rows){
  const csv = rows.map(r=> r.map(v=>{
    const s = String(v);
    return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
  }).join(',')).join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportReportCSV(){
  const period = state.reportPeriod;
  let rows, filename;
  if(period==='daily'){
    const s = dayStats(state.reportDate);
    const pct = s.restaurantRevenue>0 ? (s.foodCost/s.restaurantRevenue*100) : 0;
    rows = [
      ['Montra Nivesha — Daily Report', state.reportDate],
      [],
      ['Date','Restaurant Revenue','Events Revenue','Total Revenue','Food Cost','Food Cost %','Orders','Events Settled'],
      [state.reportDate, s.restaurantRevenue.toFixed(2), s.eventsRevenue.toFixed(2), s.revenue.toFixed(2), s.foodCost.toFixed(2), pct.toFixed(1)+'%', s.orders, s.eventsCount]
    ];
    filename = `montra-nivesha-daily-report-${state.reportDate}.csv`;
  } else if(period==='monthly'){
    const dim = daysInMonth(state.reportMonth);
    rows = [['Montra Nivesha — Monthly Report', state.reportMonth], [], ['Date','Restaurant Revenue','Events Revenue','Total Revenue','Food Cost','Orders','Events Settled']];
    let totalRest=0, totalEv=0, totalRev=0, totalFC=0, totalOrd=0, totalEvCount=0;
    for(let d=1; d<=dim; d++){
      const dateStr = `${state.reportMonth}-${String(d).padStart(2,'0')}`;
      const s = dayStats(dateStr);
      rows.push([dateStr, s.restaurantRevenue.toFixed(2), s.eventsRevenue.toFixed(2), s.revenue.toFixed(2), s.foodCost.toFixed(2), s.orders, s.eventsCount]);
      totalRest+=s.restaurantRevenue; totalEv+=s.eventsRevenue; totalRev+=s.revenue; totalFC+=s.foodCost; totalOrd+=s.orders; totalEvCount+=s.eventsCount;
    }
    rows.push(['Total', totalRest.toFixed(2), totalEv.toFixed(2), totalRev.toFixed(2), totalFC.toFixed(2), totalOrd, totalEvCount]);
    filename = `montra-nivesha-monthly-report-${state.reportMonth}.csv`;
  } else {
    const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    rows = [['Montra Nivesha — Yearly Report', state.reportYear], [], ['Month','Restaurant Revenue','Events Revenue','Total Revenue','Food Cost','Orders','Events Settled']];
    let totalRest=0, totalEv=0, totalRev=0, totalFC=0, totalOrd=0, totalEvCount=0;
    for(let m=1; m<=12; m++){
      const monthKey = `${state.reportYear}-${String(m).padStart(2,'0')}`;
      const s = monthStats(monthKey);
      rows.push([monthNames[m-1], s.restaurantRevenue.toFixed(2), s.eventsRevenue.toFixed(2), s.revenue.toFixed(2), s.foodCost.toFixed(2), s.orders, s.eventsCount]);
      totalRest+=s.restaurantRevenue; totalEv+=s.eventsRevenue; totalRev+=s.revenue; totalFC+=s.foodCost; totalOrd+=s.orders; totalEvCount+=s.eventsCount;
    }
    rows.push(['Total', totalRest.toFixed(2), totalEv.toFixed(2), totalRev.toFixed(2), totalFC.toFixed(2), totalOrd, totalEvCount]);
    filename = `montra-nivesha-yearly-report-${state.reportYear}.csv`;
  }
  downloadCSV(filename, rows);
}

function todayDetailHtml(){
  const paidOrders = state.orders.filter(o=>o.status==='paid' && new Date(o.createdAt).toISOString().slice(0,10)===todayStr());
  const bySection = {};
  const byItem = {};
  paidOrders.forEach(o=>{
    o.items.forEach(it=>{
      const mi = menuItem(it.itemId);
      if(!mi) return;
      byItem[mi.name] = (byItem[mi.name]||0) + it.qty;
      let secLabel = 'Room Service';
      if(o.target.type==='table'){ secLabel = sectionName(tableById(o.target.id)?.section); }
      bySection[secLabel] = (bySection[secLabel]||0) + mi.price*it.qty;
    });
  });
  const topItems = Object.entries(byItem).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxSection = Math.max(1, ...Object.values(bySection));
  return `
  <div class="section-block">
    <div class="section-head"><h2>Revenue by Section — Today</h2></div>
    ${Object.keys(bySection).length===0 ? '<div class="empty">No settled orders yet today — generate a bill from Orders &amp; KDS to see this populate.</div>' :
      Object.entries(bySection).map(([name,val])=>`
      <div class="bar-row">
        <div class="bar-label">${name}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${(val/maxSection*100)}%"></div></div>
        <div class="bar-val">${money(val)}</div>
      </div>`).join('')}
  </div>

const CAL_STATUS_COLOR = {Inquiry:'var(--st-reserved)', Confirmed:'var(--midblue)', Completed:'var(--st-available)', Cancelled:'var(--st-cleaning)'};
function eventsCalendarHtml(){
  const [y,m] = state.calendarMonth.split('-').map(Number);
  const firstOfMonth = new Date(y, m-1, 1);
  const startWeekday = firstOfMonth.getDay(); // 0=Sun
  const dim = new Date(y, m, 0).getDate();
  const monthLabel = firstOfMonth.toLocaleDateString(undefined, {year:'numeric', month:'long'});
  const eventsByDate = {};
  state.events.forEach(ev=>{
    if(ev.status==='Cancelled') return;
    (eventsByDate[ev.date] = eventsByDate[ev.date]||[]).push(ev);
  });

  const cells = [];
  for(let i=0;i<startWeekday;i++) cells.push(null);
  for(let d=1; d<=dim; d++) cells.push(d);
  while(cells.length % 7 !== 0) cells.push(null);

  const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  return `
  <div style="display:flex; align-items:center; gap:10px; margin:10px 0 14px 0;">
    <button class="btn small ghost" id="calPrevBtn">&larr;</button>
    <div style="font-weight:700; color:var(--navy); min-width:150px;">${monthLabel}</div>
    <button class="btn small ghost" id="calNextBtn">&rarr;</button>
    <button class="btn small ghost" id="calTodayBtn">Today</button>
  </div>
  <div style="display:grid; grid-template-columns:repeat(7,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;">
    ${dayNames.map(d=>`<div style="background:#FBFAF7; padding:6px 8px; font-size:11px; font-weight:700; color:var(--sub); text-align:center;">${d}</div>`).join('')}
    ${cells.map(d=>{
      if(d===null) return `<div style="background:#FAFAF8; min-height:86px;"></div>`;
      const dateStr = `${state.calendarMonth}-${String(d).padStart(2,'0')}`;
      const isToday = dateStr===todayStr();
      const dayEvents = eventsByDate[dateStr]||[];
      return `
      <div style="background:var(--paper); min-height:86px; padding:5px 6px; position:relative;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:11.5px; font-weight:700; color:${isToday?'var(--gold)':'var(--navy)'};">${d}</span>
          <span data-quickadd-event="${dateStr}" style="cursor:pointer; color:var(--midblue); font-size:13px; font-weight:700;" title="Add event on this date">+</span>
        </div>
        ${dayEvents.slice(0,3).map(ev=>`
          <div data-edit-event="${ev.id}" style="cursor:pointer; background:${CAL_STATUS_COLOR[ev.status]}; color:#fff; border-radius:3px; padding:2px 5px; font-size:10.5px; margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${ev.name} — ${ev.startTime}${ev.travelAgency?' — '+ev.travelAgency:''}${ev.voucherNumber?' — Voucher #'+ev.voucherNumber:''}">${ev.startTime} ${ev.name}</div>
        `).join('')}
        ${dayEvents.length>3 ? `<div style="font-size:10px; color:var(--sub); margin-top:2px;">+${dayEvents.length-3} more</div>` : ''}
      </div>`;
    }).join('')}
  </div>`;
}

      <div class="kv" style="color:var(--sub); font-size:12px;"><span>&nbsp;&nbsp;of which net price</span><span>${money(net)}</span></div>

      <div class="kv total"><span>Total</span><span>${money(total)}</span></div>
      <div class="kv"><span>Deposit received</span><span>&minus;${money(deposit)}</span></div>
      <div class="kv total"><span>Balance due</span><span>${money(balanceDue)}</span></div>
      ${alreadyPaid ? `<div style="margin-top:12px; padding:8px 10px; background:var(--st-available-bg); color:var(--st-available); border-radius:var(--radius); font-size:12.5px;">This invoice has been settled.</div>` : `

        <select id="evBillMethod">
          <option value="cash" ${settleMethod==='cash'?'selected':''}>Cash / Card — settle now</option>

        <div class="qty-ctl">
          <button data-svcdraft-dec="${i}">&minus;</button><span>${es.qty}</span><button data-svcdraft-inc="${i}">+</button>
          <button data-svcdraft-del="${i}" style="margin-left:8px; color:var(--st-occupied); border:none; background:none; cursor:pointer; font-weight:700; font-size:14px;">&times;</button>
        </div>
      </div>`;
    }).join('');
}
function attachServiceDraftHandlers(){
  document.querySelectorAll('[data-svcdraft-inc]').forEach(el=>{
    el.onclick = ()=>{ eventServiceDraft[Number(el.dataset.svcdraftInc)].qty++; renderServiceDraftList(); };
  });
  document.querySelectorAll('[data-svcdraft-dec]').forEach(el=>{
    el.onclick = ()=>{
      const i = Number(el.dataset.svcdraftDec);
      eventServiceDraft[i].qty--;
      if(eventServiceDraft[i].qty<=0) eventServiceDraft.splice(i,1);
      renderServiceDraftList();
    };
  });
  document.querySelectorAll('[data-svcdraft-del]').forEach(el=>{
    el.onclick = ()=>{ eventServiceDraft.splice(Number(el.dataset.svcdraftDel),1); renderServiceDraftList(); };
  });
}
function renderServiceDraftList(){
  // Partial re-render: only redraws the services list, so typed but unsaved
  // fields elsewhere in the event form (name, client, guests, etc.) are untouched.
  const wrap = document.getElementById('svcDraftListWrap');
  if(!wrap) return;
  wrap.innerHTML = serviceDraftListHtml();
  attachServiceDraftHandlers();
}

/* =========================================================
   VIEW: GUEST FEEDBACK (staff-side)

function starDisplay(n){
  let html = '';
  for(let i=1;i<=5;i++) html += `<span style="color:${i<=n?'var(--gold)':'#DCD6C8'};">&#9733;</span>`;
  return html;
}
function feedbackHtml(){
  const rows = state.feedback.slice().sort((a,b)=> b.id-a.id);
  const avg = (key)=>{
    const withVal = state.feedback.filter(f=>f[key]>0);
    if(withVal.length===0) return 0;
    return withVal.reduce((s,f)=>s+f[key],0)/withVal.length;
  };
  const overallAvg = avg('overallRating'), foodAvg = avg('foodRating'), serviceAvg = avg('serviceRating');
  const newCount = state.feedback.filter(f=>f.status==='new').length;
  return `
  <div class="cards-row">
    <div class="stat-card"><div class="lbl">Overall Rating</div><div class="val">${overallAvg? overallAvg.toFixed(1):'—'}</div><div class="sub">${state.feedback.length} response(s)</div></div>
    <div class="stat-card"><div class="lbl">Food Quality</div><div class="val">${foodAvg? foodAvg.toFixed(1):'—'}</div><div class="sub">Average out of 5</div></div>
    <div class="stat-card"><div class="lbl">Service</div><div class="val">${serviceAvg? serviceAvg.toFixed(1):'—'}</div><div class="sub">Average out of 5</div></div>
    <div class="stat-card"><div class="lbl">Needs Review</div><div class="val">${newCount}</div><div class="sub">Unread responses</div></div>
  </div>
  ${rows.length===0 ? '<div class="empty">No feedback submitted yet.</div>' : rows.map(f=>`
    <div class="kcard" style="margin:0 0 12px 0; padding:14px 16px;">
      <div style="display:flex; justify-content:space-between; align-items:flex-start;">
        <div>
          <div style="font-weight:700; color:var(--navy); font-size:13.5px;">${f.name}${f.contact?' &middot; '+f.contact:''}</div>
          <div style="font-size:11.5px; color:var(--sub); margin-top:2px;">${f.visitType}${f.ref?' &middot; '+f.ref:''} &middot; ${f.date}</div>
        </div>
        <span class="status-pill ${f.status==='new'?'pill-reserved':'pill-available'}">${f.status==='new'?'NEW':'REVIEWED'}</span>
      </div>
      <div style="display:flex; gap:18px; margin:8px 0; font-size:12px; color:var(--sub);">
        <span>Overall ${starDisplay(f.overallRating)}</span>
        <span>Food ${starDisplay(f.foodRating)}</span>
        <span>Service ${starDisplay(f.serviceRating)}</span>
      </div>
      ${f.comment ? `<div style="font-size:13px; color:var(--ink); margin-bottom:8px;">"${f.comment}"</div>` : ''}
      <div style="display:flex; gap:6px;">
        ${f.status==='new' ? `<button class="btn small gold" data-review-feedback="${f.id}">Mark Reviewed</button>` : ''}
        <button class="btn small danger" data-del-feedback="${f.id}">Delete</button>
      </div>
    </div>`).join('')}
  `;
}

function renderModal(){
  let el = document.getElementById('modalOverlay');
  if(el) el.remove();
  if(!state.modal) return;
  const wrap = document.createElement('div');
  wrap.id='modalOverlay'; wrap.className='overlay';
  wrap.innerHTML = modalHtml();
  document.body.appendChild(wrap);
  wrap.onclick = (e)=>{ if(e.target===wrap) closeModal(); };
  attachModalHandlers();
}

function modalHtml(){
  const m = state.modal;
  if(m.type==='table') return tableModalHtml(m.id);
  if(m.type==='reservation') return reservationModalHtml();
  if(m.type==='menuItem') return menuItemModalHtml(m.id);
  if(m.type==='bill') return billModalHtml(m.orderId, m);
  if(m.type==='customer') return customerModalHtml(m.kind, m.id);
  if(m.type==='staffUser') return staffModalHtml(m.id);
  if(m.type==='myProfile') return profileModalHtml();
  if(m.type==='ledgerAccount') return ledgerAccountModalHtml(m.id);
  if(m.type==='roomStatement') return roomStatementModalHtml(m.roomId);
  if(m.type==='ledgerStatement') return ledgerStatementModalHtml(m.accountId);
  if(m.type==='venue') return venueModalHtml(m.id);
  if(m.type==='package') return packageModalHtml(m.id);
  if(m.type==='service') return serviceModalHtml(m.id);
  if(m.type==='businessSource') return businessSourceModalHtml(m.id);
  if(m.type==='event') return eventModalHtml(m.id, m.prefillDate);
  if(m.type==='eventInvoice') return eventInvoiceModalHtml(m.eventId, m.method);
  return '';
}

      <div class="field" style="margin-top:14px;"><label>Split payment across</label>

      <div class="field" style="margin-top:14px;"><label>Settlement method</label>
        <select id="billMethod">
          <option value="cash" ${method==='cash'?'selected':''}>Cash / Card — settle now</option>

      ${method==='room' ? `

          </select>
        </div>
        <div style="font-size:11.5px; color:var(--sub);">Charge is added to the room's folio, to be collected at hotel checkout.</div>
      ` : ''}
      ${method==='ledger' ? `
        <div class="field"><label>City ledger account</label>
          <select id="billLedger">
            ${state.cityLedgerAccounts.map(a=>`<option value="${a.id}">${a.name}</option>`).join('')}
          </select>
        </div>
        <div style="font-size:11.5px; color:var(--sub);">Charge is added to the account's running balance, invoiced separately.</div>
      ` : ''}
    </div>
    <div class="modal-foot">
      <button class="btn ghost" id="printInvoiceBtn">Print</button>
      <button class="btn ghost" data-close>Close</button>
      <button class="btn gold" data-settle-bill="${o.id}">${method==='cash'?'Mark as Paid':(method==='room'?'Post to Room':'Post to Ledger')}</button>
    </div>
  </div>`;
}

/* ---- Customer QR preview / live ordering ---- */

                    <div>
                      <div class="pn">${m.name}</div>
                      <div class="pp">${money(m.price)}</div>
                    </div>
                  </div>
                  <div class="qty-ctl">
                    <button data-cart-dec="${m.id}">&minus;</button>
                    <span>${state.cart[m.id]||0}</span>
                    <button data-cart-inc="${m.id}">+</button>

          ` : `

            <div style="font-size:10.5px; color:var(--sub); margin:-4px 0 6px 0;">Use the arrows to choose which dish comes out first.</div>
            ${state.cartOrder.map((iid,i)=>{
              const m = menuItem(Number(iid));
              return `
              <div class="pitem">
                <div><div class="pn">${i+1}. ${m.name}</div><div class="pp">${state.cart[iid]}&times; &middot; ${money(m.price*state.cart[iid])}</div></div>
                <div class="qty-ctl">
                  <button data-seq-up="${i}" ${i===0?'disabled':''}>&uarr;</button>
                  <button data-seq-down="${i}" ${i===state.cartOrder.length-1?'disabled':''}>&darr;</button>
                </div>
              </div>`;
            }).join('')}
            <div class="pcat">Special note / dietary</div>
            <textarea id="cartNote" rows="4" placeholder="e.g. Nut allergy, no MSG, extra spicy..." style="width:100%; padding:7px 8px; border:1px solid var(--line); border-radius:var(--radius); font-family:Arial; font-size:12.5px;">${state.cartNote||''}</textarea>
            <div style="margin-top:10px;"><a href="#" id="backToBrowse" style="font-size:12px; color:var(--midblue); text-decoration:none;">&larr; Back to menu, add more items</a></div>
          `}
        </div>
        <div class="phone-foot">
          <div class="cart-total"><span>${cartCount} item(s)</span><span>${money(cartTotal)}</span></div>
          ${step==='browse' ?
            `<button class="btn gold" style="width:100%; justify-content:center;" id="submitPickBtn" ${cartCount===0?'disabled':''}>Submit &amp; Continue</button>` :
            `<button class="btn gold" style="width:100%; justify-content:center;" data-send-order="${kind}:${id}" ${cartCount===0?'disabled':''}>Send to Kitchen</button>`

    </div>
    <div class="modal-foot"><button class="btn ghost" data-close>Close preview</button></div>
